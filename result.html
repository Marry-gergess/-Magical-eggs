<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبروك تم فتح البيضة ى :!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>المخلوق الذي حصلت عليها:</h1>

    <div id="result-container">
        <div id="final-result">
            <p> جاري فتح البيضة السحرية...</p>
        </div>
    </div>

    <a href="index.html" style="text-decoration: none;">
        <button class="open-btn" style="max-width: 300px; margin: 30px auto;">فتح بيضة أخرى</button>
    </a>

    <script>
        window.onload = function() {
            const resultDiv = document.getElementById('final-result');
            const urlParams = new URLSearchParams(window.location.search);

            const eggName = urlParams.get('egg');
            const animalName = urlParams.get('name');
            const animalPrice = urlParams.get('price');
            const animalRarity = urlParams.get('rarity');
            const animalCurrency = urlParams.get('currency');
            const playerName = urlParams.get('player');
            const discordTicket = urlParams.get('discord');

            if (animalName && eggName && playerName && discordTicket) {
                
                // تجهيز حزمة البيانات المطابقة لكود الـ Apps Script
                const dataToSend = {
                    playerName: playerName,
                    discordTicket: discordTicket,
                    eggType: eggName,
                    animalName: animalName
                };

                // ⚠️ ضعي الرابط الخاص بكِ بين علامتي التنصيص بالأسفل:
                const googleScriptUrl = "https://script.google.com/macros/s/AKfycbzGvmTbGGsEBfO04QxxOViJKjaCOSrxMZmFG_VfR5KtdUOWqCwjJLylMAP86eBSwB2Esw/exec";

                // إرسال البيانات صامتة وآمنة فوراً للجوجل شيت
                fetch(googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors', 
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dataToSend)
                })
                .then(() => {
                    // عرض الفرد السحري والبيانات الموثقة للاعب
                    resultDiv.innerHTML = `
                        <p style="font-size: 18px;"> الاسم السحري: <strong style="color: #4a4e69;">${playerName}</strong></p>
                        <p style="font-size: 16px; background: #e2ece9; display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; color: #2a9d8f;">
                           رقم تيكت ديسكورد  : ${discordTicket}
                        </p>
                        <hr style="margin: 15px 0; border: 0; border-top: 1px dashed #ccc;">
                        <p>لقد اخترت: <strong>${eggName}</strong></p>
                        <p> وظهر لك المخلوق السحري التالي:</p>
                        <h3 style="font-size: 32px; color: #d90429; margin: 10px 0;">${animalName}</h3>
                        <p>السعر : ${animalPrice} ${animalCurrency}</p>
                        <p>تصنيف وزارة السحر: ${animalRarity}</p>
                        <hr style="margin: 15px 0; border: 0; border-top: 1px dashed #ccc;">
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultDiv.innerHTML = `<p style="color: red;">حدث خطأ حاول مرة اخرى.</p>`;
                });

            } else {
                resultDiv.innerHTML = "<p> عفواً، هناك بيانات ناقصة. يرجى ملء جميع البيانات .</p>";
            }
        };
    </script>
</body>
</html>

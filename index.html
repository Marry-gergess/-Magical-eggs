<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر آل بوتر للحيوانات السحرية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>متجر آل بوتر للحيوانات السحرية</h1>
        <p class="subtitle">أدخل بياناتك السحرية أولاً، ثم اختر البيضة لفتحها!</p>

        <div class="user-info-container">
            <div class="input-group">
                <label for="player-name">الاسم المروض:</label>
                <input type="text" id="player-name" placeholder="اكتب اسمك هنا..." required>
            </div>

            <div class="input-group">
                <label for="discord-ticket">رقم تيكت ديسكورد:</label>
                <input type="text" id="discord-ticket" placeholder="مثال: #1122..." required>
            </div>
        </div>

        <div class="egg-container">
            
            <div class="egg-card">
                <img src="images/common-egg.png" alt="بيضة عادية" class="egg-image">
                <h3>بيضة عادية</h3>
                <span class="rarity-tag common-tag">تصنيف X</span>
                <button type="button" class="open-egg-btn" onclick="startOpeningCustom('common')">افتح بيضة عادية</button>
            </div>

            <div class="egg-card">
                <img src="images/rare-egg.png" alt="بيضة نادرة" class="egg-image">
                <h3>بيضة نادرة</h3>
                <span class="rarity-tag rare-tag">تصنيف XX</span>
                <button type="button" class="open-egg-btn" onclick="startOpeningCustom('rare')">افتح بيضة نادرة</button>
            </div>

            <div class="egg-card">
                <img src="images/legendary-egg.png" alt="بيضة أسطورية" class="egg-image">
                <h3>بيضة أسطورية</h3>
                <span class="rarity-tag legendary-tag">تصنيف XXXX</span>
                <button type="button" class="open-egg-btn" onclick="startOpeningCustom('legendary')">افتح بيضة أسطورية</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
